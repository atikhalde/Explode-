name: Live Market Scanner + Telegram Alerts

# IST = UTC+5:30.  NSE runs 09:15-15:30 IST  =  03:45-10:00 UTC (Mon-Fri).
# Intraday scans every 15 min 09:30-15:15 IST + one EOD digest run.
# NOTE: GitHub's scheduled workflows can lag a few minutes under load;
# for 15-min precision use workflow on a VPS/Render cron instead (same code).
on:
  schedule:
    - cron: '*/15 4-9 * * 1-5'    # 09:30 .. 15:29 IST, Mon-Fri (intraday)
    - cron: '8 10 * * 1-5'        # 15:38 IST (EOD digest, full bar)
  workflow_dispatch:              # manual run button in the Actions tab

permissions:
  contents: write   # lets the job commit the alert-state file back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run live scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 live_scanner.py --max 900 --threads 8

      - name: Persist alert state
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state/alerts_state.json
          git diff --cached --quiet || git commit -m "alert state [skip ci]"
          git push
